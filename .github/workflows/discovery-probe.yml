name: Product discovery benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test public product catalog and optional search API
        env:
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, os
          products=['CeraVe Hydrating Cleanser','Pura D or Vitamin C Serum','Maybelline Sky High Mascara']
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MH-VIE benchmark/1.0','Accept':'application/json'}),timeout=20) as r:
                  return json.load(r)
          report=[]
          for p in products:
              for provider,base in [('open_beauty_facts','https://world.openbeautyfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=5&search_terms='),('openverse','https://api.openverse.org/v1/images/?page_size=5&q=')]:
                  try:
                      d=get(base+urllib.parse.quote(p))
                      rows=d.get('products',d.get('results',[]))
                      report.append(dict(product=p,provider=provider,status='OK',count=len(rows),candidates=[dict(title=x.get('product_name',x.get('title')),image=x.get('image_front_url',x.get('url')),source=x.get('foreign_landing_url')) for x in rows]))
                  except Exception as e:
                      report.append(dict(product=p,provider=provider,status='ERROR',error=str(e)))
              endpoint=os.getenv('SEARXNG_URL','').strip().rstrip('/')
              if endpoint:
                  try:
                      d=get(endpoint+'/search?format=json&categories=general&q='+urllib.parse.quote('site:instagram.com '+p))
                      rows=d.get('results',[])
                      report.append(dict(product=p,provider='instagram_index',status='OK',count=len(rows),candidates=[dict(title=x.get('title'),url=x.get('url')) for x in rows[:10]]))
                  except Exception as e:
                      report.append(dict(product=p,provider='instagram_index',status='ERROR',error=str(e)))
              else:
                  report.append(dict(product=p,provider='instagram_index',status='NOT_CONFIGURED'))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with open('discovery-report.json','w') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-report
          path: discovery-report.json
