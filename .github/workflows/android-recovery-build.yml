name: MH-VIE Android recovery build
on:
  push:
    branches: ['feature/v015-search-integration']
    paths: ['extracted-source/**', '.github/workflows/android-recovery-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Prepare ephemeral debug signing
        working-directory: extracted-source
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build recovered application
        working-directory: extracted-source
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Record APK hash
        working-directory: extracted-source
        run: sha256sum app/build/outputs/apk/debug/*.apk > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mhvie-recovery-debug
          path: |
            extracted-source/app/build/outputs/apk/debug/*.apk
            extracted-source/apk-sha256.txt
          if-no-files-found: error
