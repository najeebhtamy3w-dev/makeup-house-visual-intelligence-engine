name: Extract source
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import zipfile,pathlib,stat,shutil
          with zipfile.ZipFile('makeup-house.zip') as z:
              es=z.infolist()
              assert len(es)<10000 and sum(i.file_size for i in es)<250000000
              assert z.testzip() is None
              root=pathlib.Path('extracted-source')
              root.mkdir()
              for i in es:
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in i.filename and not stat.S_ISLNK(i.external_attr>>16)
                  if i.is_dir(): continue
                  if any(x in ('.git','.github','__MACOSX') for x in p.parts): continue
                  if p.name in ('.env','local.properties','google-services.json') or p.suffix in ('.jks','.keystore','.pem','.p12'): continue
                  d=root.joinpath(*p.parts)
                  d.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(i) as s,d.open('xb') as t: shutil.copyfileobj(s,t)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c development
          git add extracted-source
          git commit -m "Extract source archive"
          git push origin development
