name: MH-VIE Model Performance Benchmark
on:
  push:
    branches: ['feature/v015-search-integration']
    paths: ['.github/workflows/model-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        visual: [256, 384, 768, 1024]
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack single uploaded ZIP if present
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('acceptance/blind10')
          archive=p/'MHVIE_blind_10.zip'
          if archive.exists():
              expected={'manifest.json'} | {f'images/{i:02}.jpg' for i in range(1,11)}
              with zipfile.ZipFile(archive) as z:
                  entries=z.infolist()
                  assert len(entries)==11 and {x.filename for x in entries}==expected
                  assert sum(x.file_size for x in entries)<=100000000
                  for x in entries:
                      assert x.file_size<=10000000
                      target=p/x.filename
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(x))
          PY
      - name: Validate dataset before model download
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('acceptance/blind10')
          rows=json.loads((p/'manifest.json').read_text())
          assert len(rows)==10
          for row in rows:
              assert not any(row.get(k) for k in ('name','fields','seeds'))
              f=(p/row['image']).resolve()
              assert f.is_relative_to(p.resolve())
              assert hashlib.sha256(f.read_bytes()).hexdigest()==row['sha256']
          PY
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 accelerate==1.6.0 Pillow huggingface_hub
      - run: python -m pip check
      - run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download, model_info
          import json
          info=model_info('Qwen/Qwen3-VL-2B-Instruct')
          assert info.card_data.license=='apache-2.0'
          assert info.sha
          open('model-provenance.json','w').write(json.dumps({'repository':info.id,'revision':info.sha,'declared_license':info.card_data.license}))
          snapshot_download('Qwen/Qwen3-VL-2B-Instruct',revision=info.sha,local_dir='qwen-model',allow_patterns=['*.json','*.safetensors','*.txt','*.jinja'])
          PY
      - name: Real repeated inference on identical three photos
        run: |
          lscpu > hardware.txt
          free -h >> hardware.txt
          set -o pipefail
          timeout 1800s python -u -m engine.performance_benchmark --model-dir qwen-model --visual-tokens ${{ matrix.visual }} --output performance.json acceptance/blind10/images/01.jpg acceptance/blind10/images/03.jpg acceptance/blind10/images/10.jpg 2>&1 | tee performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-v${{ matrix.visual }}
          path: |
            performance.json
            performance.log
            hardware.txt
            model-provenance.json
