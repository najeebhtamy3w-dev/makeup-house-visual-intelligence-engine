name: MH-VIE blind real photos
on:
  push:
    branches: [development]
    paths: ['acceptance/blind10/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dataset before model download
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('acceptance/blind10')
          rows=json.loads((p/'manifest.json').read_text())
          assert len(rows)==10
          for row in rows:
              assert not any(row.get(k) for k in ('name','fields','seeds'))
              f=(p/row['image']).resolve()
              assert f.is_relative_to(p.resolve())
              assert hashlib.sha256(f.read_bytes()).hexdigest()==row['sha256']
          PY
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.51.3 accelerate==1.6.0 Pillow huggingface_hub
      - run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('Qwen/Qwen2.5-VL-3B-Instruct',revision='1b989f2c63999d7344135894d3cfa8f494116743',local_dir='qwen-model',allow_patterns=['*.json','*.safetensors','*.txt','*.jinja'])
          PY
      - run: |
          set -o pipefail
          python -m engine.blind_identity_acceptance --manifest acceptance/blind10/manifest.json --model qwen-model --output blind-report.json 2>&1 | tee blind-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-real-photo-evidence
          path: |
            blind-report.json
            blind-log.txt
