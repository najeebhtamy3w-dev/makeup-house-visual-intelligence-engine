name: MH-VIE live pipeline
on:
  push:
    branches: [development]
    paths: ['engine/live_pipeline_benchmark.py','.github/workflows/live-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python -m engine.live_pipeline_benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pipeline-report
          path: results-v081/
