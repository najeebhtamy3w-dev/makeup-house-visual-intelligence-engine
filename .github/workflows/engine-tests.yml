name: MH-VIE engine regression
on:
  push:
    branches: [development, 'feature/v015-search-integration']
    paths: ['engine/**', 'tests/**', 'requirements-service.txt', '.github/workflows/engine-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q engine tests
      - run: python -m pip install -r requirements-service.txt zxing-cpp==2.3.0 numpy httpx==0.28.1
      - run: python -m pip check
      - run: python -c "from fastapi.testclient import TestClient; from engine.service_api import create_app; from engine.job_handler import JobHandler"
      - run: python -m unittest discover -s tests -v
      - name: Real barcode inference
        run: python -m engine.model_smoke
      - name: Live reference benchmark
        if: github.event_name == 'workflow_dispatch'
        run: python -m engine.benchmark
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: mhvie-v06-reference
          path: results-v06/
