name: MH-VIE engine regression
on:
  push:
    branches: [development]
    paths: ['engine/**', 'tests/**', '.github/workflows/engine-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow zxing-cpp==2.3.0 numpy
      - run: python -m unittest discover -s tests -v
      - name: Real barcode inference
        run: python -m engine.model_smoke
      - name: Live reference benchmark
        if: github.event_name == 'workflow_dispatch'
        run: python -m engine.benchmark
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: mhvie-v06-reference
          path: results-v06/
