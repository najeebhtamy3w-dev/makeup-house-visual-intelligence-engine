name: MH-VIE Image Finder Lite
on:
  push:
    branches: [feature/image-finder-lite]
    paths: ['engine/image_finder_lite.py', '.github/workflows/image-finder-lite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Start SearXNG
        run: |
          mkdir -p config
          printf 'use_default_settings: true\nserver:\n  secret_key: "ci-only-not-production"\n  limiter: false\nsearch:\n  formats: [html, json]\n' > config/settings.yml
          docker run -d --name searxng -p 127.0.0.1:8080:8080 -v "$PWD/config:/etc/searxng" searxng/searxng:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 2; done
          exit 1
      - name: Search and download actual images
        run: |
          python -m engine.image_finder_lite --endpoint http://127.0.0.1:8080 --host instagram.com --host cdninstagram.com --host fbcdn.net --host cerave.com --host purador.com --host maybelline.com --host cdn.shopify.com --host mielleorganics.com --query 'CeraVe Hydrating Facial Cleanser' --query "Pura D'or Vitamin C Serum" --query 'Maybelline Sky High Mascara' --query 'Mielle Rosemary Mint Strengthening Leave-In Conditioner 355 ml'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-finder-lite-evidence
          path: finder-results/
      - name: Search diagnostics
        if: always()
        run: docker logs --tail 80 searxng || true
