name: MH-VIE aesthetic inference
on:
  push:
    branches: [development, 'feature/v015-search-integration']
    paths: ['engine/aesthetic.py','engine/aesthetic_benchmark.py','.github/workflows/aesthetic-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aesthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install open_clip_torch==2.32.0 Pillow
      - run: |
          mkdir -p aesthetic-results
          git clone https://github.com/LAION-AI/aesthetic-predictor.git upstream-aesthetic
          git -C upstream-aesthetic checkout 6d122adad522
          git -C upstream-aesthetic rev-parse HEAD > aesthetic-results/upstream-revision.txt
          cp upstream-aesthetic/LICENSE aesthetic-results/LICENSE-LAION
          sha256sum upstream-aesthetic/sa_0_4_vit_l_14_linear.pth > aesthetic-results/head.sha256
          python - <<'PY'
          import open_clip, pathlib
          path=open_clip.download_pretrained(open_clip.get_pretrained_cfg('ViT-L-14','openai'))
          pathlib.Path('clip-path.txt').write_text(path)
          PY
      - run: |
          set -o pipefail
          python -m engine.aesthetic_benchmark "$(cat clip-path.txt)" upstream-aesthetic/sa_0_4_vit_l_14_linear.pth "$(cut -d' ' -f1 aesthetic-results/head.sha256)" 2>&1 | tee aesthetic-results/run.log
      - name: Integrated visual evaluator inference
        run: |
          python - <<'PY'
          import json, math
          from PIL import Image, ImageDraw
          from pathlib import Path
          from engine.visual_evaluator import LocalClip, VisualEvaluator
          from engine.aesthetic import AestheticPredictor
          encoder=LocalClip(Path('clip-path.txt').read_text().strip())
          head=AestheticPredictor(encoder,'upstream-aesthetic/sa_0_4_vit_l_14_linear.pth',Path('aesthetic-results/head.sha256').read_text().split()[0])
          image=Image.new('RGB',(512,512),'white')
          ImageDraw.Draw(image).rectangle((180,80,330,440),fill='navy')
          image.save('aesthetic-results/fixture.png')
          result=VisualEvaluator(encoder,head,image)('aesthetic-results/fixture.png','cosmetic bottle')
          assert math.isfinite(result['aesthetic_normalized'])
          assert result['similarity_cosine']>0.99
          assert result['verified'] is False
          Path('aesthetic-results/integrated.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aesthetic-report
          path: aesthetic-results/
