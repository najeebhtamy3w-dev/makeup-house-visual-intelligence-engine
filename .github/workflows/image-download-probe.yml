name: Product image download benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install Pillow
      - name: Download and validate public image candidates
        run: |
          mkdir -p results
          python -u - <<'PY'
          import urllib.request, urllib.error, io, json, hashlib, pathlib
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,urljoin
          from PIL import Image,ImageOps,ImageDraw
          Image.MAX_IMAGE_PIXELS=25000000
          class Meta(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and (a.get('property') or a.get('name')) in ('og:image','og:image:secure_url','twitter:image'): self.urls.append(a.get('content',''))
          pages=['https://www.instagram.com/p/Df9S5mqjDod/','https://www.instagram.com/reel/DJo2Pngy6u_/','https://www.instagram.com/p/Ded8vszCK6V/','https://www.cerave.com/skincare/cleansers/hydrating-facial-cleanser','https://purador.com/products/20vitamincserum','https://www.maybelline.com/eye-makeup/mascara/lash-sensational-sky-high-washable-mascara-makeup']
          blocked=set(); report=[]; thumbs=[]; hashes=set()
          def fetch(url,limit):
              host=urlsplit(url).hostname
              if host in blocked: raise RuntimeError('SKIPPED_RATE_LIMIT')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MH-VIE image benchmark/1.0'}),timeout=10) as r:
                      data=r.read(limit+1)
                      if len(data)>limit: raise ValueError('size limit')
                      return data,r.headers.get_content_type()
              except urllib.error.HTTPError as e:
                  if e.code==429: blocked.add(host)
                  raise
          for page in pages:
              try:
                  raw,_=fetch(page,5000000); parser=Meta(); parser.feed(raw.decode('utf-8','replace'))
                  for link in list(dict.fromkeys(parser.urls))[:4]:
                      url=urljoin(page,link); row=dict(source=page,image_url=url,rights='UNVERIFIED')
                      try:
                          host=urlsplit(url).hostname or ''
                          if urlsplit(url).scheme!='https' or not any(host==d or host.endswith('.'+d) for d in ['cdninstagram.com','cerave.com','purador.com','maybelline.com']): raise ValueError('unapproved image host')
                          if 'logo' in urlsplit(url).path.lower(): raise ValueError('logo candidate')
                          raw,mime=fetch(url,10000000)
                          if not mime.startswith('image/'): raise ValueError('not image MIME')
                          digest=hashlib.sha256(raw).hexdigest()
                          with Image.open(io.BytesIO(raw)) as im:
                              im.load(); w,h=im.size
                              row.update(width=w,height=h,format=im.format,sha256=digest,bytes=len(raw))
                              if digest in hashes: row['status']='DUPLICATE'
                              else:
                                  hashes.add(digest); name=f'image-{len(report)+1:02d}.png'
                                  im.convert('RGB').save('results/'+name)
                                  row.update(file=name,status='DOWNLOADED_REVIEW_REQUIRED')
                                  thumbs.append((name,ImageOps.contain(im.convert('RGB'),(240,240))))
                      except Exception as e: row.update(status='REJECTED_OR_FAILED',error=str(e))
                      report.append(row); print(json.dumps(row),flush=True)
              except Exception as e:
                  row=dict(source=page,status='PAGE_FAILED',error=str(e)); report.append(row); print(json.dumps(row),flush=True)
              pathlib.Path('results/report.json').write_text(json.dumps(report,indent=2))
          if thumbs:
              sheet=Image.new('RGB',(750,280*((len(thumbs)+2)//3)),'white'); draw=ImageDraw.Draw(sheet)
              for i,(name,im) in enumerate(thumbs):
                  x=(i%3)*250; y=(i//3)*280; sheet.paste(im,(x,y)); draw.text((x+5,y+245),name,fill='black')
              sheet.save('results/contact-sheet.jpg')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-review
          path: results/
