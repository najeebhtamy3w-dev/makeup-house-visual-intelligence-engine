name: Instagram public access probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public connectivity
        run: |
          python - <<'PY'
          import socket, urllib.request, urllib.error
          for url in ['https://www.instagram.com/', 'https://www.instagram.com/cerave/', 'https://www.instagram.com/maybelline/', 'https://www.google.com/']:
              host=urllib.parse.urlsplit(url).hostname
              try:
                  socket.getaddrinfo(host,443)
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MH-VIE connectivity test'}),timeout=15) as r:
                      print(url, 'HTTP',r.status,'final URL',r.url)
              except urllib.error.HTTPError as e: print(url,'HTTP',e.code)
              except Exception as e: print(url,type(e).__name__,str(e))
          PY
      - name: Install pinned extractor
        run: python -m pip install 'gallery-dl @ git+https://github.com/mikf/gallery-dl.git@ceeb5bc6a402d3528ec58014ac379e0acfa95f1b'
      - name: Public account extraction test
        run: |
          gallery-dl --version
          for account in cerave maybelline; do
            echo "Account: $account"
            timeout 45s gallery-dl --simulate --range 1-2 --no-input "https://www.instagram.com/$account/" || echo "Extractor exit: $?"
          done
